name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
      - name: Test and vet
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Validate generated protocol
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          buf lint
          buf generate
          git diff --exit-code -- gen
      - name: Check protocol compatibility
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=main'
      - name: Build release targets and enforce binary budget
        run: |
          mkdir -p dist
          for target in linux/amd64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            suffix=""
            if [ "$goos" = windows ]; then suffix=.exe; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "dist/hiddify-tui-${goos}-${goarch}${suffix}" ./cmd/hiddify-tui
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "dist/hiddify-agent-${goos}-${goarch}${suffix}" ./cmd/hiddify-agent
          done
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/hiddify-migrate-linux-amd64 ./cmd/hiddify-migrate
          for f in dist/*; do
            printf '%s %s bytes  gzip %s bytes\n' "$(basename "$f")" "$(wc -c < "$f")" "$(gzip -c "$f" | wc -c)"
          done
          # Investigate thresholds documented in TODO.md: tui > 20 MiB, agent > 12 MiB.
          size=$(wc -c < dist/hiddify-tui-linux-amd64)
          test "$size" -le 20971520 || { echo "hiddify-tui exceeds 20 MiB investigate threshold: $size bytes"; exit 1; }
          agent_size=$(wc -c < dist/hiddify-agent-linux-amd64)
          test "$agent_size" -le 12582912 || { echo "hiddify-agent exceeds 12 MiB investigate threshold: $agent_size bytes"; exit 1; }
