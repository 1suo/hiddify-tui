name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
      - name: Test and vet
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Validate generated protocol
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          buf lint
          buf generate
          git diff --exit-code -- gen
      - name: Build release targets and enforce binary budget
        run: |
          mkdir -p dist
          for target in linux/amd64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            suffix=""
            if [ "$goos" = windows ]; then suffix=.exe; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "dist/hiddify-tui-${goos}-${goarch}${suffix}" ./cmd/hiddify-tui
          done
          find dist -type f -printf '%f %s bytes\n'
          size=$(wc -c < dist/hiddify-tui-linux-amd64)
          test "$size" -le 15728640 || { echo "hiddify-tui exceeds 15 MiB budget: $size bytes"; exit 1; }
