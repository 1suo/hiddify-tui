name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.12
      - name: Test and vet
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Validate generated protocol
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          buf lint
          buf generate
          git diff --exit-code -- gen
      - name: Check protocol compatibility
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=main'
      - name: Build release targets and enforce binary budget
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            suffix=""
            if [ "$goos" = windows ]; then suffix=.exe; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "dist/hiddify-tui-${goos}-${goarch}${suffix}" ./cmd/hiddify-tui
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "dist/hiddify-migrate-${goos}-${goarch}${suffix}" ./cmd/hiddify-migrate
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "dist/hiddify-core-daemon-${goos}-${goarch}${suffix}" ./cmd/hiddify-core-daemon
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/hiddify-core-host-windows-amd64.exe ./cmd/hiddify-core-host
          for f in dist/*; do
            printf '%s %s bytes  gzip %s bytes\n' "$(basename "$f")" "$(wc -c < "$f")" "$(gzip -c "$f" | wc -c)"
          done
          # Investigate threshold documented in TODO.md: tui > 20 MiB.
          size=$(wc -c < dist/hiddify-tui-linux-amd64)
          test "$size" -le 20971520 || { echo "hiddify-tui exceeds 20 MiB investigate threshold: $size bytes"; exit 1; }
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - name: Validate packaging assets
        run: |
          bash -n scripts/release.sh scripts/render-package-manifests.sh
          bash -n packaging/linux/*.sh packaging/macos/*.sh packaging/nfpm/*.sh
          bash -n packaging/aur/PKGBUILD.tmpl
          jq -e . packaging/scoop/hiddify-tui.json.tmpl

  windows-core-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.12
      - name: Build host and fetch official core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          go build -trimpath -ldflags='-s -w' -o dist/hiddify-core-host.exe ./cmd/hiddify-core-host
          Invoke-WebRequest https://github.com/hiddify/hiddify-core/releases/download/v4.1.0/hiddify-lib-windows-amd64.tar.gz -OutFile dist/core.tar.gz
          if ((Get-FileHash dist/core.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fc610e67d9fdf23da7cc10633f38806d7081a1c120157d1fbe5ac8cc41b315b4') { throw 'core checksum mismatch' }
          tar.exe -xzf dist/core.tar.gz -C dist
      - name: Start DLL host and verify gRPC listener
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$pwd\dist\hiddify-core-host.exe" -ArgumentList 'serve', '-D', "$pwd\dist\state" -PassThru
          try {
            $listening = $false
            foreach ($attempt in 1..50) {
              if ($process.HasExited) { throw "host exited with code $($process.ExitCode)" }
              try {
                $client = [Net.Sockets.TcpClient]::new('127.0.0.1', 17078)
                $client.Dispose()
                $listening = $true
                break
              } catch {
                Start-Sleep -Milliseconds 200
              }
            }
            if (-not $listening) { throw 'gRPC listener did not start' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
