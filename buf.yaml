version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Repository layout is locked by the project plan.
    - PACKAGE_DIRECTORY_MATCH
    # Shared resource and operation result messages are intentional API types.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
