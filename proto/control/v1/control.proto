syntax = "proto3";

package hiddify.control.v1;

option go_package = "github.com/1suo/hiddify-tui/gen/control/v1;controlv1";

// ControlService is the versioned, local-only API between thin clients and the
// daemon. This draft intentionally starts with the read path used by status.
service ControlService {
  rpc GetSnapshot(GetSnapshotRequest) returns (Snapshot);
  rpc WatchEvents(WatchRequest) returns (stream Event);
}

message GetSnapshotRequest {}

message Snapshot {
  uint32 api_major = 1;
  uint32 api_minor = 2;
  string daemon_version = 3;
  string core_version = 4;
  ConnectionState connection_state = 5;
  string active_profile_id = 6;
  string active_profile_name = 7;
  string requested_mode = 8;
  string effective_mode = 9;
  string selected_outbound = 10;
  string last_error = 11;
  uint64 revision = 12;
  uint64 event_sequence = 13;
}

message WatchRequest {
  uint64 after_sequence = 1;
}

message Event {
  uint64 sequence = 1;
  uint64 revision = 2;
  oneof change {
    ConnectionChange connection = 3;
    ProfileChange profile = 4;
    OutboundChange outbound = 5;
    Warning warning = 6;
    ResyncRequired resync_required = 7;
  }
}

message ConnectionChange {
  ConnectionState state = 1;
  string requested_mode = 2;
  string effective_mode = 3;
}

message ProfileChange {
  string active_profile_id = 1;
  string active_profile_name = 2;
}

message OutboundChange {
  string selected_outbound = 1;
}

message Warning {
  string message = 1;
}

message ResyncRequired {}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_STOPPED = 1;
  CONNECTION_STATE_STARTING = 2;
  CONNECTION_STATE_STARTED = 3;
  CONNECTION_STATE_STOPPING = 4;
  CONNECTION_STATE_RECONNECT_WAIT = 5;
  CONNECTION_STATE_FAILED = 6;
}
