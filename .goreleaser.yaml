version: 2

project_name: hiddify-tui

builds:
  - id: hiddify-tui
    main: ./cmd/hiddify-tui
    binary: hiddify-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: hiddify-migrate
    main: ./cmd/hiddify-migrate
    binary: hiddify-migrate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: hiddify-core-daemon
    main: ./cmd/hiddify-core-daemon
    binary: hiddify-core-daemon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: hiddify-core-host
    main: ./cmd/hiddify-core-host
    binary: hiddify-core-host
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids:
      - hiddify-tui
      - hiddify-migrate
      - hiddify-core-daemon
      - hiddify-core-host
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - install.sh
      - docs/man/hiddify-tui.1
      - completions/*
      - packaging/linux/install.sh
      - packaging/linux/uninstall.sh
      - packaging/systemd/hiddify-core.service
      - install.ps1
      - packaging/windows/install.ps1
      - packaging/windows/uninstall.ps1

checksum:
  name_template: checksums.txt

nfpms:
  - id: client-packages
    ids:
      - hiddify-tui
      - hiddify-migrate
    package_name: hiddify-tui
    file_name_template: >-
      {{ .ConventionalFileName }}
    vendor: 1suo
    homepage: https://github.com/1suo/hiddify-tui
    maintainer: 1suo <isuo1991@outlook.com>
    description: Terminal client for hiddify-core
    license: MIT
    bindir: /usr/bin
    formats:
      - deb
      - rpm
    contents:
      - src: docs/man/hiddify-tui.1
        dst: /usr/share/man/man1/hiddify-tui.1
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/hiddify-tui/LICENSE
        file_info:
          mode: 0644
      - src: completions/hiddify-tui.bash
        dst: /usr/share/bash-completion/completions/hiddify-tui
        file_info:
          mode: 0644
      - src: completions/_hiddify-tui
        dst: /usr/share/zsh/site-functions/_hiddify-tui
        file_info:
          mode: 0644
      - src: completions/hiddify-tui.fish
        dst: /usr/share/fish/vendor_completions.d/hiddify-tui.fish
        file_info:
          mode: 0644
    suggests:
      - wl-clipboard
      - xclip
      - xsel

  - id: daemon-packages
    ids:
      - hiddify-core-daemon
    package_name: hiddify-tui-daemon
    file_name_template: >-
      {{ .ConventionalFileName }}
    vendor: 1suo
    homepage: https://github.com/1suo/hiddify-tui
    maintainer: 1suo <isuo1991@outlook.com>
    description: Headless lifecycle wrapper for hiddify-core
    license: MIT
    bindir: /usr/lib/hiddify
    formats:
      - deb
      - rpm
    contents:
      - src: packaging/systemd/hiddify-core.service
        dst: /usr/lib/systemd/system/hiddify-core.service
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/hiddify-tui-daemon/LICENSE
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/nfpm/postinstall.sh
      postremove: packaging/nfpm/postremove.sh

sboms:
  - id: archive-sboms
    artifacts: archive
  - id: package-sboms
    artifacts: package

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
